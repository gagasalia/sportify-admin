<div class="p-4">
  <form [formGroup]="courtForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Court Name (Georgian) -->
    <label class="ss-field">
      <span class="ss-label georgian-text" lang="ka">
        {{ 'კორტის სახელი' | t }} <span class="text-red-500">*</span>
      </span>
      <input
        class="ss-input georgian-text"
        lang="ka"
        [class.ss-input--invalid]="courtForm.get('name')?.touched && courtForm.get('name')?.invalid"
        formControlName="name"
      />
      @if (courtForm.get('name')?.touched && courtForm.get('name')?.invalid) {
        <span class="ss-error georgian-text" lang="ka">{{ 'შეიყვანეთ კორტის სახელი' | t }}</span>
      }
    </label>

    <!-- Court Name (English) -->
    <label class="ss-field">
      <span class="ss-label">Name (English)</span>
      <input class="ss-input" formControlName="nameEn" />
    </label>

    <!-- Sport Type -->
    <label class="ss-field">
      <span class="ss-label georgian-text" lang="ka">
        {{ 'სპორტის ტიპი' | t }} <span class="text-red-500">*</span>
      </span>
      <select class="ss-input georgian-text" lang="ka" formControlName="sportType">
        @for (type of sportTypes; track type) {
          <option [value]="type">{{ sportTypeLabels[type] | t }}</option>
        }
      </select>
    </label>

    <!-- Location Type (Indoor/Outdoor/Covered) -->
    <label class="ss-field">
      <span class="ss-label georgian-text" lang="ka">
        {{ 'კორტის ტიპი' | t }} <span class="text-red-500">*</span>
      </span>
      <select class="ss-input georgian-text" lang="ka" formControlName="locationType">
        @for (locationType of locationTypes; track locationType) {
          <option [value]="locationType">{{ locationTypeLabels[locationType] | t }}</option>
        }
      </select>
    </label>

    <!-- Court Surface -->
    <div formGroupName="surface" class="space-y-4">
      <h3 class="text-lg font-medium georgian-text" lang="ka">{{ 'საფარი' | t }}</h3>

      <!-- Surface Material -->
      <label class="ss-field">
        <span class="ss-label georgian-text" lang="ka">
          {{ 'მატერიალი' | t }} <span class="text-red-500">*</span>
        </span>
        <select class="ss-input georgian-text" lang="ka" formControlName="material">
          @for (material of surfaceMaterials; track material) {
            <option [value]="material">{{ surfaceMaterialLabels[material] | t }}</option>
          }
        </select>
      </label>

      <!-- Surface Color -->
      <label class="ss-field">
        <span class="ss-label georgian-text" lang="ka">
          {{ 'ფერი' | t }} <span class="text-red-500">*</span>
        </span>
        <select class="ss-input georgian-text" lang="ka" formControlName="color">
          @for (color of surfaceColors; track color) {
            <option [value]="color">{{ surfaceColorLabels[color] | t }}</option>
          }
        </select>
      </label>
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-end gap-2 mt-6">
      <button class="ss-btn ss-btn--flat" type="button" (click)="onCancel()">
        <span class="georgian-text" lang="ka">{{ 'გაუქმება' | t }}</span>
      </button>
      <button class="ss-btn ss-btn--primary" type="submit" [disabled]="!courtForm.valid">
        <span class="georgian-text" lang="ka">{{ 'შენახვა' | t }}</span>
      </button>
    </div>
  </form>
</div>
