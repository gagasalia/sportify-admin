<div
  class="ss-card overflow-hidden transition-shadow hover:shadow-lg flex flex-col h-full"
>
  <!-- Header with Toggle and Status -->
  <div
    class="flex items-center justify-between p-4 border-b h-[72px]"
    style="border-color: var(--tui-border-normal); background: var(--tui-background-neutral-1)"
  >
    <div class="flex items-center gap-3">
      <input
        class="ss-switch"
        type="checkbox"
        [ngModel]="activeState()"
        (ngModelChange)="onToggleState($event)"
        [attr.aria-label]="'გამოქვეყნება' | t"
      />

      @if (activeState()) {
        <span class="ss-badge ss-badge--positive georgian-text" lang="ka">{{ 'გამოქვეყნებული' | t }}</span>
      } @else {
        <span class="ss-badge ss-badge--neutral georgian-text" lang="ka">{{ 'მონახაზი' | t }}</span>
      }
    </div>
  </div>

  <!-- Photo Section -->
  <div class="relative h-68" style="background: var(--tui-background-neutral-1)">
    <img
      [src]="primaryPhoto"
      [alt]="displayDescription() || '--'"
      class="w-full h-full object-cover"
    />
    @if (hasMultiplePhotos) {
      <div
        class="absolute bottom-3 right-3 bg-black/70 text-white px-2 py-1 rounded-md text-xs font-medium"
      >
        1 / {{ photoCount }}
      </div>
    }
  </div>

  <!-- Content Section -->
  <div class="p-4 flex flex-col flex-1">
    <h3 class="text-lg font-bold m-0 georgian-text h-7 line-clamp-1" lang="ka">
      {{ displayName() || '--' }}
    </h3>
    <p
      class="text-sm m-0 leading-relaxed georgian-text h-10 line-clamp-2 mt-2 mb-3"
      lang="ka"
      style="color: var(--tui-text-secondary)"
    >
      {{ displayDescription() || '--' }}
    </p>

    <button
      type="button"
      class="flex gap-2 h-11 mb-4 w-full text-left cursor-pointer hover:opacity-80 transition-opacity"
      (click)="openInGoogleMaps($event)"
    >
      <i class="ss-ic mt-0.5" style="--ss-ic: url('assets/taiga-ui/icons/map-pin.svg'); color: var(--tui-text-action)"></i>
      <div class="text-sm leading-snug georgian-text" lang="ka" style="color: var(--tui-text-secondary)">
        <div class="line-clamp-1">{{ facility.addressText || '--' }}</div>
        <div class="line-clamp-1">{{ (cityName || '--') | t }}, {{ (countryName || '--') | t }}</div>
      </div>
    </button>

    <!-- Action Buttons -->
    <div class="flex gap-2 mt-auto items-center">
      <!-- Edit -->
      <button
        class="ss-btn ss-btn--outline ss-btn--s flex-1 min-w-0"
        type="button"
        (click)="onEdit($event)"
        [attr.aria-label]="'რედაქტირება' | t"
      >
        <i class="ss-ic" style="--ss-ic: url('assets/taiga-ui/icons/pencil.svg'); width: 14px; height: 14px"></i>
        <span class="georgian-text truncate" lang="ka">{{ 'რედაქტირება' | t }}</span>
      </button>

      <!-- Courts -->
      <a
        class="ss-btn ss-btn--primary ss-btn--s flex-1 min-w-0"
        [routerLink]="['/configuration/courts']"
        [queryParams]="{ facilityId: facility._id ?? facility.id }"
        [attr.aria-label]="'კორტები' | t"
      >
        <i class="ss-ic" style="--ss-ic: url('assets/taiga-ui/icons/layout-grid.svg'); width: 14px; height: 14px"></i>
        <span class="georgian-text truncate" lang="ka">{{ 'კორტები' | t }}</span>
      </a>

      <!-- Delete -->
      <button
        class="ss-icon-btn ss-icon-btn--danger"
        type="button"
        (click)="onDelete($event)"
        [attr.aria-label]="'წაშლა' | t"
      >
        <i class="ss-ic" style="--ss-ic: url('assets/taiga-ui/icons/trash-2.svg')"></i>
      </button>
    </div>
  </div>
</div>
