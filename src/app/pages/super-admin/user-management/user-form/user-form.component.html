<div class="h-[80vh] overflow-y-auto p-1">
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Email -->
    <label class="ss-field">
      <span class="ss-label georgian-text" lang="ka">
        {{ 'ელ. ფოსტა' | t }} <span class="text-red-500">*</span>
      </span>
      <input
        class="ss-input"
        [class.ss-input--invalid]="userForm.get('email')?.touched && userForm.get('email')?.invalid"
        type="email"
        formControlName="email"
      />
      @if (userForm.get('email')?.touched && userForm.get('email')?.hasError('email')) {
        <span class="ss-error georgian-text" lang="ka">{{ 'არასწორი ელ. ფოსტის ფორმატი' | t }}</span>
      }
    </label>

    <!-- Password -->
    <label class="ss-field">
      <span class="ss-label georgian-text" lang="ka">
        {{ 'პაროლი' | t }}
        @if (!isEditMode) {
          <span class="text-red-500">*</span>
        }
      </span>
      <input class="ss-input" type="password" formControlName="password" />
      @if (isEditMode) {
        <span class="text-xs georgian-text" lang="ka" style="color: var(--tui-text-secondary)">
          {{ 'დატოვეთ ცარიელი თუ არ გსურთ შეცვლა' | t }}
        </span>
      }
    </label>

    <!-- First Name & Last Name -->
    <div class="grid grid-cols-2 gap-4">
      <label class="ss-field">
        <span class="ss-label georgian-text" lang="ka">{{ 'სახელი' | t }}</span>
        <input class="ss-input georgian-text" lang="ka" formControlName="firstName" />
      </label>
      <label class="ss-field">
        <span class="ss-label georgian-text" lang="ka">{{ 'გვარი' | t }}</span>
        <input class="ss-input georgian-text" lang="ka" formControlName="lastName" />
      </label>
    </div>

    <!-- Identity: admins sign in by username (no phone), players by phone -->
    @if (isAdminAccount) {
      <label class="ss-field">
        <span class="ss-label georgian-text" lang="ka">
          {{ 'მომხმარებლის სახელი' | t }} <span class="text-red-500">*</span>
        </span>
        <input
          class="ss-input"
          [class.ss-input--invalid]="userForm.get('username')?.touched && userForm.get('username')?.invalid"
          type="text"
          autocapitalize="none"
          spellcheck="false"
          formControlName="username"
          placeholder="admin.name"
        />
        @if (userForm.get('username')?.touched && userForm.get('username')?.hasError('required')) {
          <span class="ss-error georgian-text" lang="ka">{{
            'მომხმარებლის სახელი სავალდებულოა' | t
          }}</span>
        }
        @if (userForm.get('username')?.touched && userForm.get('username')?.hasError('pattern')) {
          <span class="ss-error georgian-text" lang="ka">
            {{ '3-32 სიმბოლო: ლათინური ასოები, ციფრები, წერტილი, ტირე ან ქვედა ტირე' | t }}
          </span>
        }
        <span class="text-xs georgian-text" lang="ka" style="color: var(--tui-text-secondary)">
          {{ 'ადმინის ანგარიშს ტელეფონის ნომერი არ აქვს — შესვლა ხდება მომხმარებლის სახელით' | t }}
        </span>
      </label>
    } @else {
      <label class="ss-field">
        <span class="ss-label georgian-text" lang="ka">
          {{ 'ტელეფონი' | t }} <span class="text-red-500">*</span>
        </span>
        <input
          class="ss-input"
          [class.ss-input--invalid]="userForm.get('phone')?.touched && userForm.get('phone')?.invalid"
          type="tel"
          formControlName="phone"
          [maskito]="phoneMask"
          placeholder="+9955XXXXXXXX"
        />
        @if (userForm.get('phone')?.touched && userForm.get('phone')?.hasError('required')) {
          <span class="ss-error georgian-text" lang="ka">{{
            'ტელეფონის ნომერი სავალდებულოა' | t
          }}</span>
        }
        @if (userForm.get('phone')?.touched && userForm.get('phone')?.hasError('pattern')) {
          <span class="ss-error georgian-text" lang="ka">
            {{ 'ნომერი უნდა იწყებოდეს 5-ით და იყოს 9 ციფრი' | t }}
          </span>
        }
      </label>
    }

    <!-- PID -->
    <label class="ss-field">
      <span class="ss-label georgian-text" lang="ka">{{ 'პირადი ნომერი' | t }}</span>
      <input
        class="ss-input"
        formControlName="pid"
        [maskito]="pidMask"
        placeholder="XXXXXXXXXXX"
      />
      @if (userForm.get('pid')?.touched && userForm.get('pid')?.hasError('pattern')) {
        <span class="ss-error georgian-text" lang="ka">{{
          'პირადი ნომერი უნდა იყოს 11 ციფრი' | t
        }}</span>
      }
    </label>

    <!-- Date of Birth -->
    <label class="ss-field">
      <span class="ss-label georgian-text" lang="ka">{{ 'დაბადების თარიღი' | t }}</span>
      <input class="ss-input" type="date" formControlName="dateOfBirth" />
    </label>

    <!-- User Type (multi-select — a user can hold several roles) -->
    <div class="ss-field">
      <span class="ss-label georgian-text" lang="ka"
        >{{ 'როლი' | t }} <span class="text-red-500">*</span></span
      >
      <div class="flex flex-wrap gap-3 mt-1">
        @for (type of userTypes; track type) {
          <label class="flex items-center gap-2 cursor-pointer">
            <input
              class="ss-checkbox"
              type="checkbox"
              [checked]="isRoleChecked(type)"
              (change)="toggleRole(type)"
            />
            <span class="georgian-text text-sm" lang="ka">{{ userTypeLabels[type] }}</span>
          </label>
        }
      </div>
      @if (userForm.get('userType')?.touched && userForm.get('userType')?.hasError('required')) {
        <span class="ss-error georgian-text" lang="ka">{{ 'როლი სავალდებულოა' | t }}</span>
      }
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-end gap-2 mt-6">
      <button class="ss-btn ss-btn--flat" type="button" (click)="onCancel()">
        <span class="georgian-text" lang="ka">{{ 'გაუქმება' | t }}</span>
      </button>
      <button class="ss-btn ss-btn--primary" type="submit" [disabled]="!userForm.valid">
        <span class="georgian-text" lang="ka">{{
          (isEditMode ? 'განახლება' : 'დამატება') | t
        }}</span>
      </button>
    </div>
  </form>
</div>
