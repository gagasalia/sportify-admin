<div class="max-h-[80vh] overflow-y-auto p-1">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Name -->
    <label class="ss-field">
      <span class="ss-label georgian-text" lang="ka">
        {{ 'სახელი' | t }} <span class="text-red-500">*</span>
      </span>
      <input
        class="ss-input"
        [class.ss-input--invalid]="form.get('name')?.touched && form.get('name')?.invalid"
        formControlName="name"
        placeholder="Summer Open 2026"
      />
      @if (form.get('name')?.touched && form.get('name')?.invalid) {
        <span class="ss-error georgian-text" lang="ka">{{ 'მინიმუმ 3 სიმბოლო' | t }}</span>
      }
    </label>
    <!-- Name (English) -->
    <label class="ss-field">
      <span class="ss-label">Name (English)</span>
      <input class="ss-input" formControlName="nameEn" placeholder="Summer Open 2026" />
    </label>

    <!-- Facility (single-select chips, first facility preselected on create) -->
    <div class="ss-field">
      <span class="ss-label georgian-text" lang="ka">
        {{ 'ობიექტი' | t }} <span class="text-red-500">*</span>
      </span>
      <div
        class="ss-chip-rail ss-chip-rail--wrap"
        role="radiogroup"
        [attr.aria-label]="'ობიექტი' | t"
      >
        @for (facility of facilities(); track facilityId(facility)) {
          <button
            type="button"
            class="ss-chip"
            role="radio"
            [class.is-active]="selectedFacilityId() === facilityId(facility)"
            [attr.aria-checked]="selectedFacilityId() === facilityId(facility)"
            (click)="selectFacility(facilityId(facility))"
          >
            {{ facilityLabel(facility) }}
          </button>
        }
      </div>
    </div>

    <!-- Type + Format -->
    <div class="grid grid-cols-2 gap-4">
      <label class="ss-field">
        <span class="ss-label georgian-text" lang="ka">
          {{ 'ტიპი' | t }} <span class="text-red-500">*</span>
        </span>
        <select class="ss-input georgian-text" lang="ka" formControlName="type">
          @for (option of typeOptions; track option) {
            <option [value]="option">{{ stringifyType(option) }}</option>
          }
        </select>
      </label>
      <label class="ss-field">
        <span class="ss-label georgian-text" lang="ka">
          {{ 'ფორმატი' | t }} <span class="text-red-500">*</span>
        </span>
        <select class="ss-input georgian-text" lang="ka" formControlName="format">
          @for (option of formatOptions; track option) {
            <option [value]="option">{{ stringifyFormat(option) }}</option>
          }
        </select>
      </label>
    </div>

    <!-- Level + Category -->
    <div class="grid grid-cols-2 gap-4">
      <label class="ss-field">
        <span class="ss-label georgian-text" lang="ka">{{ 'დონე' | t }}</span>
        <select class="ss-input georgian-text" lang="ka" formControlName="level">
          @for (option of levelOptions; track option) {
            <option [value]="option">{{ stringifyLevel(option) }}</option>
          }
        </select>
      </label>
      <label class="ss-field">
        <span class="ss-label georgian-text" lang="ka">{{ 'კატეგორია' | t }}</span>
        <select class="ss-input georgian-text" lang="ka" formControlName="category">
          @for (option of categoryOptions; track option) {
            <option [value]="option">{{ stringifyCategory(option) }}</option>
          }
        </select>
      </label>
    </div>

    <!-- Start date + time -->
    <div class="grid grid-cols-2 gap-4">
      <label class="ss-field">
        <span class="ss-label georgian-text" lang="ka">
          {{ 'დაწყების თარიღი' | t }} <span class="text-red-500">*</span>
        </span>
        <input class="ss-input" type="date" formControlName="startDate" />
      </label>
      <label class="ss-field">
        <span class="ss-label georgian-text" lang="ka">
          {{ 'დაწყების დრო' | t }} <span class="text-red-500">*</span>
        </span>
        <input class="ss-input" type="time" formControlName="startTime" />
      </label>
    </div>

    <!-- End date + registration deadline -->
    <div class="grid grid-cols-2 gap-4">
      <label class="ss-field">
        <span class="ss-label georgian-text" lang="ka">{{ 'დასრულების თარიღი' | t }}</span>
        <input class="ss-input" type="date" formControlName="endDate" />
      </label>
      <label class="ss-field">
        <span class="ss-label georgian-text" lang="ka">{{ 'რეგისტრაციის დედლაინი' | t }}</span>
        <input class="ss-input" type="datetime-local" formControlName="registrationDeadline" />
        <span class="text-xs georgian-text" style="color: var(--tui-text-secondary)" lang="ka">
          {{ 'ცარიელი = დაწყების მომენტამდე' | t }}
        </span>
      </label>
    </div>

    <!-- Fee + capacity -->
    <div class="grid grid-cols-2 gap-4">
      <label class="ss-field">
        <span class="ss-label georgian-text" lang="ka">
          {{ 'საფასური (₾)' | t }} <span class="text-red-500">*</span>
        </span>
        <input class="ss-input" type="number" min="0" step="0.5" formControlName="entryFeeGel" />
        <span class="text-xs georgian-text" style="color: var(--tui-text-secondary)" lang="ka">{{ '0 = უფასო' | t }}</span>
      </label>
      <label class="ss-field">
        <span class="ss-label georgian-text" lang="ka">
          {{ 'ადგილები' | t }} <span class="text-red-500">*</span>
        </span>
        <input class="ss-input" type="number" min="2" max="512" formControlName="maxParticipants" />
        <span class="text-xs georgian-text" style="color: var(--tui-text-secondary)" lang="ka">
          {{ 'წყვილებისთვის — წყვილების რაოდენობა' | t }}
        </span>
      </label>
    </div>

    <!-- Prize -->
    <label class="ss-field">
      <span class="ss-label georgian-text" lang="ka">{{ 'პრიზი' | t }}</span>
      <input
        class="ss-input"
        formControlName="prizeDescription"
        [placeholder]="'₾1000 + თასები' | t"
      />
    </label>
    <!-- Prize (English) -->
    <label class="ss-field">
      <span class="ss-label">Prize (English)</span>
      <input class="ss-input" formControlName="prizeDescriptionEn" />
    </label>

    <!-- Description -->
    <label class="ss-field">
      <span class="ss-label georgian-text" lang="ka">{{ 'აღწერა' | t }}</span>
      <textarea class="ss-input georgian-text" lang="ka" formControlName="description" rows="3"></textarea>
    </label>
    <!-- Description (English) -->
    <label class="ss-field">
      <span class="ss-label">Description (English)</span>
      <textarea class="ss-input" formControlName="descriptionEn" rows="3"></textarea>
    </label>

    <!-- Actions -->
    <div class="flex justify-end gap-2 pt-2">
      <button class="ss-btn ss-btn--flat" type="button" (click)="cancel()">
        <span class="georgian-text" lang="ka">{{ 'გაუქმება' | t }}</span>
      </button>
      <button class="ss-btn ss-btn--primary" type="submit" [disabled]="isSaving()">
        <span class="georgian-text" lang="ka">{{ (isEditMode ? 'შენახვა' : 'შექმნა') | t }}</span>
      </button>
    </div>
  </form>
</div>
